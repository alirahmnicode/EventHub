[project]
name = "eventhub"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ali rahmani", email = "alirahmanicode@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "locust>=2.46.6",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
eventhub = "eventhub:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=app.services --cov-report=term-missing --cov-report=html"
markers = [
    "unit: fast isolated tests",
    "integration: tests that hit the DB or external services",
]

[tool.coverage.run]
source = ["app.services"]
omit = [
    "*/tests/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
