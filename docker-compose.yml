services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ops/healthz')" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    env_file:
      - ./.env
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./app:/code/app
    command: uv run uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    # depends_on:
    #   db:
    #     condition: service_healthy

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    command: [ "redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}" ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    ports: [ "6379:6379" ]

volumes:
  pgdata:
  redis-data:
